<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta · SlideHub</title>
  <meta name="description" content="Crie sua conta SlideHub em menos de um minuto." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E4572E'/%3E%3Cpath d='M18 42l10-20 10 20' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 34h10' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page page-auth">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <p class="auth-sub">Leva menos de um minuto. Depois é só escolher seus materiais favoritos.</p>
      <form id="form-cadastro" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required />
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required />
            <small class="field-hint">Mínimo de 8 caracteres.</small>
          </div>
          <div class="field">
            <label for="confirmar">Confirmar senha</label>
            <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" placeholder="Repita a senha" required />
          </div>
        </div>
        <div class="field">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required />
        </div>
        <p id="form-erro" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg"><span class="btn-text">Criar minha conta</span></button>
      </form>
      <p class="auth-alt">Já tem conta? <a href="/login">Entrar</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/js/cadastro.js"></script>
</body>
</html>
